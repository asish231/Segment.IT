<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>linecut studio</title>
<style>
  :root {
    --bg: #14171b; --panel: #1b1f25; --panel-2: #232830; --line: #2e353e;
    --ink: #e6eaee; --muted: #8b95a1; --accent: #4f8cf7; --accent-dim: #2b4f8f;
    --good: #46b47f; --warn: #d9a441; --bad: #d9614a;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.5 var(--sans); overflow: hidden; }

  .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }

  /* ---- sidebar ---- */
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .brand h1 { margin: 0; font-size: 15px; letter-spacing: -0.01em; }
  .brand .sub { color: var(--muted); font: 11px var(--mono); margin-top: 3px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
  .stat { background: var(--panel); padding: 8px 10px; }
  .stat b { display: block; font: 600 16px var(--mono); }
  .stat span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }

  .filter { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .filter input, .filter select {
    width: 100%; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 8px; font: 12px var(--sans);
  }
  .filter select { margin-top: 6px; }

  .pages { overflow-y: auto; flex: 1; min-height: 0; }
  .page-item { padding: 7px 12px; border-bottom: 1px solid #1f242b; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .page-item:hover { background: var(--panel-2); }
  .page-item.active { background: var(--accent-dim); }
  .page-item .nm { flex: 1; font: 11px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3a424c; flex: none; }
  .dot.part { background: var(--warn); }
  .dot.done { background: var(--good); }
  .page-item .ct { font: 10px var(--mono); color: var(--muted); }

  /* ---- main ---- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  button {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 11px; font: 12px var(--sans); cursor: pointer;
  }
  button:hover { border-color: #46505c; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .spacer { flex: 1; }
  .status { font: 11px var(--mono); color: var(--muted); }
  .status.err { color: var(--bad); }
  .status.ok { color: var(--good); }
  .mode { font: 11px var(--mono); padding: 3px 8px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); }
  .mode.draw { background: #2a3f2e; border-color: var(--good); color: #b8e6cd; }

  .canvas-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #0e1114; }
  canvas { display: block; position: absolute; inset: 0; }

  .hint {
    position: absolute; left: 12px; bottom: 12px; background: rgba(20,23,27,.92);
    border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px;
    font: 11px var(--mono); color: var(--muted); line-height: 1.7; pointer-events: none;
  }
  .hint b { color: var(--ink); font-weight: 600; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 13px var(--sans); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>linecut studio</h1>
      <div class="sub" id="root">loading…</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-total">0</b><span>pages</span></div>
      <div class="stat"><b id="s-part">0</b><span>started</span></div>
      <div class="stat"><b id="s-done">0</b><span>done</span></div>
    </div>
    <div class="filter">
      <input id="q" type="text" placeholder="filter by name…">
      <select id="f-state">
        <option value="all">all pages</option>
        <option value="todo">not started</option>
        <option value="part">started, not done</option>
        <option value="done">done</option>
      </select>
    </div>
    <div class="pages" id="pages"></div>
  </aside>

  <main>
    <div class="bar">
      <button id="b-prefill">Pre-fill</button>
      <button id="b-new">New line <span style="color:var(--muted)">N</span></button>
      <button id="b-del">Delete <span style="color:var(--muted)">⌫</span></button>
      <button id="b-clear">Clear all</button>
      <span class="mode" id="mode">select</span>
      <div class="spacer"></div>
      <span class="status" id="status"></span>
      <button id="b-save" class="primary">Save <span style="opacity:.7">S</span></button>
      <button id="b-done">Mark done <span style="color:#cfe0ff">D</span></button>
      <button id="b-export">Export PAGE-XML</button>
    </div>
    <div class="canvas-wrap" id="wrap">
      <canvas id="cv"></canvas>
      <div class="empty" id="empty">Select a page from the left</div>
      <div class="hint">
        <b>N</b> new line · click to add points · <b>Enter</b> finish<br>
        <b>drag</b> point to move · <b>click</b> line to select · <b>⌫</b> delete<br>
        <b>scroll</b> zoom · <b>space+drag</b> or middle-drag pan · <b>S</b> save · <b>D</b> done<br>
        <b>J</b> / <b>K</b> next / previous page
      </div>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

let pages = [], filtered = [], current = null;
let img = null, srcW = 0, srcH = 0, dispScale = 1;
let baselines = [], selected = -1, drawing = null;
let zoom = 1, panX = 0, panY = 0;
let dragPoint = null, panning = false, spaceDown = false, dirty = false;

/* ---------- geometry ---------- */
const toScreen = (x, y) => [x * dispScale * zoom + panX, y * dispScale * zoom + panY];
const toWorld = (sx, sy) => [(sx - panX) / (zoom * dispScale), (sy - panY) / (zoom * dispScale)];

function resize() {
  const r = $('wrap').getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener('resize', resize);

function fitPage() {
  const r = $('wrap').getBoundingClientRect();
  if (!img) return;
  const iw = srcW * dispScale, ih = srcH * dispScale;
  zoom = Math.min((r.width - 40) / iw, (r.height - 40) / ih);
  panX = (r.width - iw * zoom) / 2;
  panY = (r.height - ih * zoom) / 2;
}

/* ---------- drawing ---------- */
function draw() {
  const r = $('wrap').getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  if (!img) return;

  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(zoom, zoom);
  ctx.drawImage(img, 0, 0);
  ctx.restore();

  const all = drawing ? baselines.concat([drawing]) : baselines;
  all.forEach((bl, i) => {
    const isDraw = drawing && i === all.length - 1;
    const isSel = i === selected && !isDraw;
    ctx.lineWidth = isSel ? 3 : 2;
    ctx.strokeStyle = isDraw ? '#46b47f' : (isSel ? '#ffd166' : '#4f8cf7');
    ctx.beginPath();
    bl.forEach((p, k) => {
      const [x, y] = toScreen(p[0], p[1]);
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();

    if (isSel || isDraw) {
      ctx.fillStyle = isDraw ? '#46b47f' : '#ffd166';
      bl.forEach(p => {
        const [x, y] = toScreen(p[0], p[1]);
        ctx.beginPath(); ctx.arc(x, y, 4, 0, 6.3); ctx.fill();
      });
    }
    if (!isDraw && bl.length) {
      const [x, y] = toScreen(bl[0][0], bl[0][1]);
      ctx.fillStyle = 'rgba(0,0,0,.65)';
      ctx.fillRect(x - 22, y - 9, 19, 16);
      ctx.fillStyle = '#cfe0ff';
      ctx.font = '11px ui-monospace, monospace';
      ctx.fillText(String(i + 1), x - 19, y + 3);
    }
  });
}

/* ---------- hit testing ---------- */
function hitPoint(sx, sy) {
  if (selected < 0) return null;
  const bl = baselines[selected];
  for (let k = 0; k < bl.length; k++) {
    const [x, y] = toScreen(bl[k][0], bl[k][1]);
    if ((x - sx) ** 2 + (y - sy) ** 2 < 64) return k;
  }
  return null;
}

function hitLine(sx, sy) {
  let best = -1, bestD = 10;
  baselines.forEach((bl, i) => {
    for (let k = 1; k < bl.length; k++) {
      const [x1, y1] = toScreen(bl[k - 1][0], bl[k - 1][1]);
      const [x2, y2] = toScreen(bl[k][0], bl[k][1]);
      const dx = x2 - x1, dy = y2 - y1;
      const len2 = dx * dx + dy * dy || 1;
      let t = ((sx - x1) * dx + (sy - y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(sx - (x1 + t * dx), sy - (y1 + t * dy));
      if (d < bestD) { bestD = d; best = i; }
    }
  });
  return best;
}

/* ---------- mouse ---------- */
cv.addEventListener('mousedown', e => {
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;

  if (e.button === 1 || spaceDown) { panning = { sx, sy, panX, panY }; e.preventDefault(); return; }

  if (drawing) {
    const [wx, wy] = toWorld(sx, sy);
    drawing.push([+wx.toFixed(1), +wy.toFixed(1)]);
    dirty = true; draw(); return;
  }

  const pt = hitPoint(sx, sy);
  if (pt !== null) { dragPoint = pt; return; }

  const line = hitLine(sx, sy);
  selected = line;
  draw();
});

cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;

  if (panning) { panX = panning.panX + (sx - panning.sx); panY = panning.panY + (sy - panning.sy); draw(); return; }
  if (dragPoint !== null && selected >= 0) {
    const [wx, wy] = toWorld(sx, sy);
    baselines[selected][dragPoint] = [+wx.toFixed(1), +wy.toFixed(1)];
    dirty = true; draw();
  }
});

window.addEventListener('mouseup', () => { panning = false; dragPoint = null; });

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const before = toWorld(sx, sy);
  zoom *= e.deltaY < 0 ? 1.12 : 1 / 1.12;
  zoom = Math.max(0.05, Math.min(zoom, 20));
  const after = toWorld(sx, sy);
  panX += (after[0] - before[0]) * dispScale * zoom;
  panY += (after[1] - before[1]) * dispScale * zoom;
  draw();
}, { passive: false });

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { spaceDown = true; e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  if (k === 'n') { startDraw(); }
  else if (e.key === 'Enter') { finishDraw(); }
  else if (e.key === 'Escape') { drawing = null; setMode(); draw(); }
  else if (e.key === 'Backspace' || e.key === 'Delete') { deleteSelected(); e.preventDefault(); }
  else if (k === 's') { save(false); e.preventDefault(); }
  else if (k === 'd') { save(true); }
  else if (k === 'j') { step(1); }
  else if (k === 'k') { step(-1); }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });

/* ---------- actions ---------- */
function setMode() { const m = $('mode'); m.textContent = drawing ? 'drawing' : 'select'; m.className = 'mode' + (drawing ? ' draw' : ''); }
function startDraw() { drawing = []; selected = -1; setMode(); draw(); }
function finishDraw() {
  if (drawing && drawing.length >= 2) { baselines.push(drawing); selected = baselines.length - 1; dirty = true; }
  drawing = null; setMode(); draw();
}
function deleteSelected() {
  if (selected >= 0) { baselines.splice(selected, 1); selected = -1; dirty = true; draw(); }
}

function status(msg, cls = '') { const s = $('status'); s.textContent = msg; s.className = 'status ' + cls; }

async function loadPages() {
  const r = await fetch('/api/pages').then(r => r.json());
  pages = r.pages;
  $('root').textContent = r.root;
  $('s-total').textContent = r.total;
  $('s-part').textContent = r.annotated;
  $('s-done').textContent = r.done;
  renderPages();
}

function renderPages() {
  const q = $('q').value.toLowerCase(), st = $('f-state').value;
  filtered = pages.filter(p => {
    if (q && !p.path.toLowerCase().includes(q)) return false;
    if (st === 'todo' && p.lines) return false;
    if (st === 'part' && (!p.lines || p.done)) return false;
    if (st === 'done' && !p.done) return false;
    return true;
  });
  const box = $('pages');
  box.innerHTML = '';
  filtered.forEach(p => {
    const el = document.createElement('div');
    el.className = 'page-item' + (current === p.path ? ' active' : '');
    el.innerHTML = `<span class="dot ${p.done ? 'done' : (p.lines ? 'part' : '')}"></span>
                    <span class="nm">${p.path}</span>
                    <span class="ct">${p.lines || ''}</span>`;
    el.onclick = () => open(p.path);
    box.appendChild(el);
  });
}
$('q').oninput = renderPages;
$('f-state').onchange = renderPages;

function step(d) {
  const i = filtered.findIndex(p => p.path === current);
  const next = filtered[Math.max(0, Math.min(filtered.length - 1, i + d))];
  if (next && next.path !== current) open(next.path);
}

async function open(path) {
  if (dirty && !confirm('Unsaved changes. Discard?')) return;
  current = path; dirty = false; selected = -1; drawing = null; setMode();
  status('loading…');
  $('empty').style.display = 'none';

  const meta = await fetch('/api/meta?path=' + encodeURIComponent(path)).then(r => r.json());
  srcW = meta.width; srcH = meta.height; dispScale = meta.display_scale;

  img = new Image();
  img.onload = () => { fitPage(); draw(); status(`${srcW}×${srcH}`); };
  img.src = '/api/image?path=' + encodeURIComponent(path);

  const anno = await fetch('/api/annotation?path=' + encodeURIComponent(path)).then(r => r.json());
  baselines = anno.baselines || [];
  renderPages();
  draw();
}

$('b-prefill').onclick = async () => {
  if (!current) return;
  if (baselines.length && !confirm('Replace existing lines with fresh detection?')) return;
  status('detecting… this can take 30s'); $('b-prefill').disabled = true;
  try {
    const r = await fetch('/api/prefill?path=' + encodeURIComponent(current), { method: 'POST' });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const d = await r.json();
    baselines = d.baselines; dirty = true; selected = -1;
    status(`${baselines.length} lines · angle ${d.angle}° · margin ${d.margin}`, 'ok');
    draw();
  } catch (e) { status('prefill failed: ' + e.message, 'err'); }
  $('b-prefill').disabled = false;
};

async function save(markDone) {
  if (!current) return;
  const body = { path: current, baselines, done: !!markDone };
  const r = await fetch('/api/annotation', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  if (!r.ok) { status('save failed', 'err'); return; }
  dirty = false;
  status(`saved ${baselines.length} lines${markDone ? ' · done' : ''}`, 'ok');
  const p = pages.find(p => p.path === current);
  if (p) { p.lines = baselines.length; p.done = !!markDone; }
  $('s-part').textContent = pages.filter(p => p.lines).length;
  $('s-done').textContent = pages.filter(p => p.done).length;
  renderPages();
  if (markDone) step(1);
}
$('b-save').onclick = () => save(false);
$('b-done').onclick = () => save(true);
$('b-new').onclick = startDraw;
$('b-del').onclick = deleteSelected;
$('b-clear').onclick = () => { if (confirm('Remove all lines on this page?')) { baselines = []; selected = -1; dirty = true; draw(); } };

$('b-export').onclick = async () => {
  status('exporting…');
  const r = await fetch('/api/export?only_done=true', { method: 'POST' }).then(r => r.json());
  status(`exported ${r.exported} pages to ${r.dir}`, 'ok');
};

resize();
loadPages();
</script>
</body>
</html>
